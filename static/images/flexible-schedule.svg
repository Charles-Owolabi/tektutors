<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Flexible data learning schedule planner</title>
  <desc id="desc">A modern weekly planner highlighting morning, evening, and night mentorship options with clear availability blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10184F"/>
      <stop offset="1" stop-color="#1E2C8B"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#EEF3FF" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFAE73"/>
      <stop offset="1" stop-color="#EB6711"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0F1440" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1400" height="1000" rx="34" fill="url(#bg)"/>
  <circle cx="1200" cy="170" r="180" fill="#FFB487" fill-opacity="0.2"/>
  <circle cx="170" cy="860" r="190" fill="#95A8FF" fill-opacity="0.22"/>

  <g filter="url(#shadow)">
    <rect x="104" y="96" width="1192" height="808" rx="38" fill="#0E1546" fill-opacity="0.44"/>
    <rect x="146" y="136" width="1108" height="728" rx="30" fill="url(#glass)"/>
  </g>

  <rect x="196" y="186" width="1008" height="98" rx="18" fill="#F9FBFF" stroke="#D5DEF3"/>
  <text x="244" y="246" font-size="38" fill="#1B2475" font-family="Sora, Plus Jakarta Sans, Arial, sans-serif" font-weight="700">Choose Your Learning Rhythm</text>

  <g transform="translate(196,320)">
    <rect width="312" height="470" rx="24" fill="#EEF2FF" stroke="#D9E1F6"/>
    <text x="30" y="58" font-size="28" fill="#1B2475" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="800">Morning Track</text>
    <text x="30" y="94" font-size="20" fill="#51618A" font-family="Plus Jakarta Sans, Arial, sans-serif">6:00 AM - 8:00 AM</text>

    <rect x="30" y="132" width="252" height="70" rx="14" fill="#FFFFFF" stroke="#D8E1F7"/>
    <text x="48" y="174" font-size="20" fill="#1B2475" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="700">Mon / Wed / Fri</text>

    <text x="30" y="240" font-size="18" fill="#5A688E" font-family="Plus Jakarta Sans, Arial, sans-serif">Session consistency</text>
    <rect x="30" y="256" width="252" height="14" rx="7" fill="#DDE4F8"/>
    <rect x="30" y="256" width="210" height="14" rx="7" fill="#1B2475"/>

    <text x="30" y="316" font-size="18" fill="#5A688E" font-family="Plus Jakarta Sans, Arial, sans-serif">Learner energy score</text>
    <rect x="30" y="332" width="252" height="14" rx="7" fill="#DDE4F8"/>
    <rect x="30" y="332" width="224" height="14" rx="7" fill="url(#orange)"/>

    <rect x="30" y="388" width="252" height="52" rx="12" fill="#FFFFFF" stroke="#D8E1F7"/>
    <text x="48" y="420" font-size="18" fill="#5A688E" font-family="Plus Jakarta Sans, Arial, sans-serif">Great for early professionals</text>
  </g>

  <g transform="translate(544,320)">
    <rect width="312" height="470" rx="24" fill="#FFF2E8" stroke="#F3D8C7"/>
    <text x="30" y="58" font-size="28" fill="#B64D0D" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="800">Evening Track</text>
    <text x="30" y="94" font-size="20" fill="#7A5A45" font-family="Plus Jakarta Sans, Arial, sans-serif">6:30 PM - 8:30 PM</text>

    <rect x="30" y="132" width="252" height="70" rx="14" fill="#FFFFFF" stroke="#F3D8C7"/>
    <text x="48" y="174" font-size="20" fill="#B64D0D" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="700">Tue / Thu / Sat</text>

    <text x="30" y="240" font-size="18" fill="#7A5A45" font-family="Plus Jakarta Sans, Arial, sans-serif">Session consistency</text>
    <rect x="30" y="256" width="252" height="14" rx="7" fill="#FFE1CD"/>
    <rect x="30" y="256" width="228" height="14" rx="7" fill="#EB6711"/>

    <text x="30" y="316" font-size="18" fill="#7A5A45" font-family="Plus Jakarta Sans, Arial, sans-serif">Completion momentum</text>
    <rect x="30" y="332" width="252" height="14" rx="7" fill="#FFE1CD"/>
    <rect x="30" y="332" width="214" height="14" rx="7" fill="#D85B0E"/>

    <rect x="30" y="388" width="252" height="52" rx="12" fill="#FFFFFF" stroke="#F3D8C7"/>
    <text x="48" y="420" font-size="18" fill="#7A5A45" font-family="Plus Jakarta Sans, Arial, sans-serif">Perfect after-work schedule</text>
  </g>

  <g transform="translate(892,320)">
    <rect width="312" height="470" rx="24" fill="#EEF5FF" stroke="#D9E3F8"/>
    <text x="30" y="58" font-size="28" fill="#1B2475" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="800">Night Track</text>
    <text x="30" y="94" font-size="20" fill="#51618A" font-family="Plus Jakarta Sans, Arial, sans-serif">9:00 PM - 11:00 PM</text>

    <rect x="30" y="132" width="252" height="70" rx="14" fill="#FFFFFF" stroke="#D8E1F7"/>
    <text x="48" y="174" font-size="20" fill="#1B2475" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="700">Daily Flex Option</text>

    <text x="30" y="240" font-size="18" fill="#5A688E" font-family="Plus Jakarta Sans, Arial, sans-serif">Attendance flexibility</text>
    <rect x="30" y="256" width="252" height="14" rx="7" fill="#DDE4F8"/>
    <rect x="30" y="256" width="236" height="14" rx="7" fill="#1B2475"/>

    <text x="30" y="316" font-size="18" fill="#5A688E" font-family="Plus Jakarta Sans, Arial, sans-serif">Focus confidence</text>
    <rect x="30" y="332" width="252" height="14" rx="7" fill="#DDE4F8"/>
    <rect x="30" y="332" width="220" height="14" rx="7" fill="url(#orange)"/>

    <rect x="30" y="388" width="252" height="52" rx="12" fill="#FFFFFF" stroke="#D8E1F7"/>
    <text x="48" y="420" font-size="18" fill="#5A688E" font-family="Plus Jakarta Sans, Arial, sans-serif">Ideal for busy professionals</text>
  </g>
</svg>
