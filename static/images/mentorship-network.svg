<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mentorship network and outcomes</title>
  <desc id="desc">A connected mentorship map showing learners, mentors, projects, and career outcomes with progress indicators.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F7FF"/>
      <stop offset="0.6" stop-color="#EEF3FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="nodeBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E56D2"/>
      <stop offset="1" stop-color="#1B2475"/>
    </linearGradient>
    <linearGradient id="nodeOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB17A"/>
      <stop offset="1" stop-color="#EB6711"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F1440" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1400" height="1000" rx="34" fill="url(#bg)"/>
  <circle cx="1220" cy="150" r="170" fill="#FFB487" fill-opacity="0.18"/>
  <circle cx="180" cy="870" r="190" fill="#A8B8FF" fill-opacity="0.2"/>

  <g stroke="#C7D2EF" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M294 272 C430 188, 574 188, 710 272"/>
    <path d="M710 272 C840 188, 974 188, 1110 272"/>
    <path d="M294 272 C430 350, 574 350, 710 272"/>
    <path d="M710 272 C840 350, 974 350, 1110 272"/>
    <path d="M710 272 C760 420, 760 520, 710 640"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="294" cy="272" r="92" fill="url(#nodeBlue)"/>
    <circle cx="294" cy="272" r="62" fill="#E9EEFF"/>
    <text x="256" y="280" font-size="28" fill="#1B2475" font-family="Sora, Plus Jakarta Sans, Arial, sans-serif" font-weight="700">Learner</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="710" cy="272" r="102" fill="#10184F"/>
    <circle cx="710" cy="272" r="70" fill="#C8D4FF"/>
    <text x="660" y="280" font-size="28" fill="#1B2475" font-family="Sora, Plus Jakarta Sans, Arial, sans-serif" font-weight="700">Mentor</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="1110" cy="272" r="92" fill="url(#nodeOrange)"/>
    <circle cx="1110" cy="272" r="62" fill="#FFF0E6"/>
    <text x="1068" y="280" font-size="28" fill="#B24B0D" font-family="Sora, Plus Jakarta Sans, Arial, sans-serif" font-weight="700">Career</text>
  </g>

  <g transform="translate(166,438)">
    <rect width="1080" height="430" rx="30" fill="#FFFFFF" stroke="#D7DFF2" filter="url(#shadow)"/>
    <text x="44" y="70" font-size="34" fill="#1B2475" font-family="Sora, Plus Jakarta Sans, Arial, sans-serif" font-weight="700">Mentorship Impact Dashboard</text>

    <text x="44" y="122" font-size="21" fill="#566287" font-family="Plus Jakarta Sans, Arial, sans-serif">Portfolio completion</text>
    <rect x="44" y="138" width="860" height="22" rx="11" fill="#E2E8FA"/>
    <rect x="44" y="138" width="728" height="22" rx="11" fill="url(#nodeBlue)"/>
    <text x="930" y="155" font-size="22" fill="#1B2475" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="700">84%</text>

    <text x="44" y="208" font-size="21" fill="#566287" font-family="Plus Jakarta Sans, Arial, sans-serif">Interview readiness</text>
    <rect x="44" y="224" width="860" height="22" rx="11" fill="#FFE3CF"/>
    <rect x="44" y="224" width="774" height="22" rx="11" fill="url(#nodeOrange)"/>
    <text x="930" y="241" font-size="22" fill="#B24B0D" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="700">90%</text>

    <text x="44" y="294" font-size="21" fill="#566287" font-family="Plus Jakarta Sans, Arial, sans-serif">Subscriber referral intent</text>
    <rect x="44" y="310" width="860" height="22" rx="11" fill="#E2E8FA"/>
    <rect x="44" y="310" width="804" height="22" rx="11" fill="#1B2475"/>
    <text x="930" y="327" font-size="22" fill="#1B2475" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="700">93%</text>

    <g transform="translate(44,356)">
      <rect width="420" height="52" rx="12" fill="#EEF2FF"/>
      <text x="20" y="33" font-size="18" fill="#1B2475" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="700">Real project coaching + portfolio proof</text>
    </g>

    <g transform="translate(488,356)">
      <rect width="420" height="52" rx="12" fill="#FFF0E6"/>
      <text x="20" y="33" font-size="18" fill="#B24B0D" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="700">Career strategy + interview confidence</text>
    </g>
  </g>
</svg>
