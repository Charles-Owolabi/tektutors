{% extends "base.html" %}

{% block content %}
<section class="section auth-section">
    <div class="container auth-grid">
        <div class="auth-panel reveal">
            <p class="kicker">Forgot Password</p>
            <h1>Request a secure password reset link.</h1>
            <p>
                Enter the email attached to your approved Learning Hub account and we will send a password reset link.
            </p>
        </div>
        <form class="contact-form auth-form reveal" action="{{ url_for('forgot_password') }}" method="post">
            {{ csrf_field() }}
            <h2>Reset access</h2>
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required>
            <button type="submit" class="btn btn-primary">Send reset link</button>
            <p class="auth-switch"><a href="{{ url_for('login') }}">Back to sign in</a></p>
        </form>
    </div>
</section>
{% endblock %}
