{% extends "base.html" %}

{% block content %}
<section class="section auth-section">
    <div class="container auth-grid">
        <div class="auth-panel reveal">
            <p class="kicker">Reset Password</p>
            <h1>{{ heading }}</h1>
            <p>{{ intro }}</p>
        </div>
        <form class="contact-form auth-form reveal" action="{{ url_for('reset_password', token=token) }}" method="post">
            {{ csrf_field() }}
            <h2>Choose a new password</h2>
            <label for="password">New password</label>
            <input id="password" name="password" type="password" placeholder="At least 8 characters" required>
            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" name="confirm_password" type="password" placeholder="Repeat your password" required>
            <button type="submit" class="btn btn-primary">{{ submit_label }}</button>
            <p class="auth-switch"><a href="{{ url_for('login') }}">Back to sign in</a></p>
        </form>
    </div>
</section>
{% endblock %}
